services:
  postgres:
    image: postgres:16-alpine
    container_name: trabajaya-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trabajaya
      POSTGRES_USER: dev_admin
      POSTGRES_PASSWORD: TuPasswordSeguro123!
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
