<a href="TY-Landing.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 50%; background: #F3F0FC; color: #23153C; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">

</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { role: 'cand' }; }
renderVals() {
const cand = this.state.role === 'cand';
const card = 'min-height: 220px; padding: 22px; border-radius: 24px; font: inherit; color: #23153C; text-align: left; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; cursor: pointer; ';
const on = card + 'border: 2px solid #D13A1C; background: #FFF8F6; box-shadow: 0 0 0 4px #FFE9E3';
const off = card + 'border: 1px solid #E4DDF7; background: #FFFFFF';
const dot = 'width: 24px; height: 24px; border-radius: 50%; box-sizing: border-box; display: block; ';
const dOn = dot + 'border: 7px solid #D13A1C; background: #FFFFFF';
const dOff = dot + 'border: 2px solid #CFC4F0';
return {
isCand: cand, isEmp: !cand,
cardCand: cand ? on : off, cardEmp: cand ? off : on,
dotCand: cand ? dOn : dOff, dotEmp: cand ? dOff : dOn,
pickCand: () => this.setState({ role: 'cand' }),
pickEmp: () => this.setState({ role: 'emp' })
};
}
}
</script>
