<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reclutador · Mis Vacantes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#18181B}a:hover{color:#52525B}
</style>
</helmet>
<div style="min-height: 960px; background: #F4F4F5; color: #18181B; font-family: Figtree, system-ui, sans-serif; font-size: 15px; line-height: 1.5; display: flex; flex-wrap: wrap; align-items: stretch">
<div style="flex: 1 1 240px; max-width: 100%; background: #FFFFFF; border-right: 1px solid #D4D4D8"><dc-import name="WFSide" role="rec" active="vacantes" hint-size="100%,900px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font-size: 26px; font-weight: 800">Mis Vacantes</h1><span style="color: #52525B">[Empresa S.A.]</span></div>
<a href="WR-Asistente.dc.html" style="min-height: 44px; padding: 0 18px; border-radius: 8px; background: #18181B; color: #FFFFFF; display: flex; align-items: center; text-decoration: none; font-weight: 700">+ Nueva vacante</a>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 12px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4"><a href="WR-Postulantes.dc.html" style="background: #FFFFFF; border: 1px solid #D4D4D8; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; text-decoration: none; color: #18181B"><span style="color: #52525B; font-size: 13px">{{k}}</span><span style="font-size: 26px; font-weight: 800">[N]</span></a></sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center">
<div role="tablist" aria-label="Estado" style="display: flex; gap: 4px; padding: 4px; background: #E4E4E7; border-radius: 10px; flex-wrap: wrap">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.s}}">{{t.n}}</button></sc-for>
</div>
<label style="position: absolute; left: -9999px" for="q">Buscar vacante</label>
<input id="q" type="search" placeholder="Buscar vacante" style="flex: 0 1 280px; min-height: 44px; padding: 0 12px; border: 1px solid #A1A1AA; border-radius: 8px; font: inherit; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<article style="background: #FFFFFF; border: 1px solid #D4D4D8; border-radius: 12px; padding: 16px 18px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center">
<div style="flex: 2 1 240px; display: flex; flex-direction: column; gap: 4px"><div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap"><span style="font-weight: 800; font-size: 16px">[Puesto]</span><span style="{{r.badge}}">{{r.e}}</span></div><span style="font-size: 13px; color: #52525B">{{r.meta}}</span></div>
<div style="flex: 3 1 360px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{metrics}}" as="m" hint-placeholder-count="4"><div style="display: flex; flex-direction: column; padding: 8px; border-radius: 8px; background: #F4F4F5"><span style="font-size: 12px; color: #52525B">{{m}}</span><span style="font-weight: 800">{{r.v}}</span></div></sc-for>
</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<a href="WR-Postulantes.dc.html" style="min-height: 40px; padding: 0 14px; border-radius: 8px; background: #18181B; color: #FFFFFF; display: flex; align-items: center; text-decoration: none; font-weight: 700; font-size: 14px">Postulantes</a>
<a href="WR-Asistente.dc.html" style="min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #A1A1AA; display: flex; align-items: center; text-decoration: none; font-weight: 700; font-size: 14px">Editar</a>
<button type="button" aria-label="Más: duplicar, publicar, cerrar, eliminar borrador" style="width: 40px; height: 40px; border-radius: 8px; border: 1px solid #A1A1AA; background: #FFFFFF; font: inherit; font-weight: 800; cursor: pointer">⋯</button>
</div>
</article>
</sc-for>
</div>
<span style="font-size: 14px; color: #52525B">Vacío: “Aún no tienes vacantes” + Crear la primera. Menú ⋯: Duplicar · Publicar · Cerrar · Eliminar borrador.</span>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { t: 0 }; }
renderVals() {
const t = this.state.t;
const on = 'min-height: 40px; padding: 0 16px; border-radius: 8px; border: 0; background: #FFFFFF; font: inherit; font-weight: 800; cursor: pointer; color: #18181B';
const off = 'min-height: 40px; padding: 0 16px; border-radius: 8px; border: 0; background: transparent; font: inherit; font-weight: 600; cursor: pointer; color: #3F3F46';
const bd = 'font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; ';
const sty = { 'Publicada': 'background: #18181B; color: #FFFFFF', 'Borrador': 'border: 1px dashed #18181B', 'Cerrada': 'background: #E4E4E7' };
const all = [
{ e: 'Publicada', meta: 'Publicada el [fecha] · cierra el [fecha]', v: '[N]' },
{ e: 'Publicada', meta: 'Publicada el [fecha] · cierra el [fecha]', v: '[N]' },
{ e: 'Borrador', meta: 'Editada el [fecha]', v: '—' },
{ e: 'Cerrada', meta: 'Cerrada el [fecha]', v: '[N]' }
];
const f = ['', 'Publicada', 'Borrador', 'Cerrada'][t];
return {
kpis: ['Vacantes activas', 'Postulantes nuevos (7 días)', 'Pendientes de revisión', 'En terna'],
tabs: ['Todas', 'Publicadas', 'Borradores', 'Cerradas'].map((n, i) => ({ n, on: i === t, s: i === t ? on : off, pick: () => this.setState({ t: i }) })),
metrics: ['Postulantes', 'Entrevistas', 'Sin revisar', 'En terna'],
rows: all.filter((r) => !f || r.e === f).map((r) => ({ ...r, badge: bd + sty[r.e] }))
};
}
}
</script>
</body>
</html>
